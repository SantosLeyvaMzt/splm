<section id="contacto" class="py-5 bg-secondary text-white">
  <div class="container">
    <h2 class="text-center mb-5 display-4" i18n>Contáctanos</h2>
    
    <div class="row">
      
      <div class="col-md-6 mb-4 mb-md-0">
        <h4 class="mb-3" i18n>Envíanos un Mensaje</h4>
        <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
          <div class="mb-3">
            <label for="nombre" class="form-label" i18n>Nombre Completo</label>
            <input type="text" class="form-control" id="nombre" name="nombre" [(ngModel)]="formData.nombre" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label" i18n>Correo Electrónico</label>
            <input type="email" class="form-control" id="email" name="email" [(ngModel)]="formData.email" required>
          </div>
          <div class="mb-3">
            <label for="mensaje" class="form-label" i18n>Mensaje</label>
            <textarea class="form-control" id="mensaje" name="mensaje" rows="5" [(ngModel)]="formData.mensaje" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-lg" [disabled]="!contactForm.form.valid" i18n>Enviar Mensaje</button>
        </form>
      </div>
      
      <div class="col-md-6">
        <h4 class="mb-3" i18n>Nuestra Información</h4>
        <ul class="list-unstyled">
          <li class="mb-3">
            <i class="bi bi-geo-alt-fill me-2"></i> 
            <strong i18n>Domicilio:</strong> Alvaro Obregón #1138 ote col. Lázaro cárdenas, Los Mochis Sinaloa.
          </li>
          <li class="mb-3">
            <i class="bi bi-telephone-fill me-2"></i> 
            <strong>Tel:</strong> 668 811 20 64
          </li>
          <li class="mb-3">
            <i class="bi bi-phone-fill me-2"></i> 
            <strong>Cel:</strong> 668 249 73 34
          </li>
          <li class="mb-3">
            <i class="bi bi-envelope-fill me-2"></i> 
            <strong i18n>Correo:</strong> splm&#64;live.com.mx
          </li>
        </ul>
        
        <h4 class="mt-4 mb-3" i18n>Síguenos</h4>
        <div>
          <a target="_blank" href="https://www.facebook.com/seguridadprivadadelm" class="text-white me-3 display-6"><i class="bi bi-facebook"></i></a>
        </div>
      </div>
      
    </div>
  </div>
</section>
